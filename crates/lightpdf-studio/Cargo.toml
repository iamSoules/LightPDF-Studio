[package]
name = "lightpdf-studio"
description = "LightPDF Studio – free, open-source PDF reader and editor (pure Rust)"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "lightpdf-studio"

[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "lightpdf-studio"
path = "src/main.rs"

[dependencies]
lightpdf-core = { path = "../lightpdf-core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = "0.4"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit", "clipboard", "wayland", "x11"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
directories = "6"
open = "5"

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "android-native-activity"] }
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
jni = "0.21"
android_logger = "0.15"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }

# iOS has no OpenGL: render with wgpu (Metal)
[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }

[package.metadata.android]
package = "org.lightpdf.studio"
apk_name = "LightPDF-Studio"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
resources = "android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "LightPDF Studio"
icon = "@mipmap/ic_launcher"
theme = "@style/Theme.LightPDF"
# MainActivity (android/java) is added after cargo-apk by packaging/android/add-java.sh
has_code = true

[package.metadata.android.application.activity]
name = "org.lightpdf.studio.MainActivity"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|uiMode"
launch_mode = "singleTask"
orientation = "unspecified"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.EDIT"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]
data = [{ scheme = "content", mime_type = "application/pdf" }, { scheme = "file", mime_type = "application/pdf" }]

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.SEND"]
categories = ["android.intent.category.DEFAULT"]
data = [{ mime_type = "application/pdf" }]

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32
