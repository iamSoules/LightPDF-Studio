[package]
name = "lightpdf-core"
description = "PDF engine of LightPDF Studio: rendering, annotations, page tools (pure Rust)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hayro = "0.9.0"
lopdf = { version = "0.47.0", default-features = false, features = ["chrono-clock"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
base64 = "0.22"
flate2 = "1"
rand = "0.9"
