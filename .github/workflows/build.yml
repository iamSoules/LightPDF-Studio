name: Build

on:
  push:
    branches: [main, rust-rewrite]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --release

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p lightpdf-studio --bin lightpdf-studio
      - name: Package
        run: |
          V=$(cargo pkgid -p lightpdf-studio | sed 's/.*[#@]//')
          D=LightPDF-Studio-$V-Linux-x86_64
          mkdir -p $D/share/applications $D/share/icons/hicolor/256x256/apps $D/bin
          cp target/release/lightpdf-studio $D/bin/
          cp packaging/linux/lightpdf-studio.desktop $D/share/applications/
          cp packaging/icon-256.png $D/share/icons/hicolor/256x256/apps/lightpdf-studio.png
          cp LICENSE $D/
          tar czf $D.tar.gz $D
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: "*.tar.gz" }

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p lightpdf-studio --bin lightpdf-studio
      - name: Package
        shell: pwsh
        run: |
          $v = (cargo pkgid -p lightpdf-studio) -replace '.*[#@]', ''
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item target/release/lightpdf-studio.exe "out/LightPDF Studio.exe"
          Copy-Item LICENSE out/
          Compress-Archive -Path out/* -DestinationPath "LightPDF-Studio-$v-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "*.zip" }

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release -p lightpdf-studio --bin lightpdf-studio --target aarch64-apple-darwin
          cargo build --release -p lightpdf-studio --bin lightpdf-studio --target x86_64-apple-darwin
      - name: App bundle + DMG (universal, ad-hoc signed)
        run: |
          V=$(cargo pkgid -p lightpdf-studio | sed 's/.*[#@]//')
          APP="LightPDF Studio.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/lightpdf-studio" \
            target/aarch64-apple-darwin/release/lightpdf-studio target/x86_64-apple-darwin/release/lightpdf-studio
          sed "s/VERSION/$V/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          mkdir AppIcon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/icon-1024.png --out AppIcon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) packaging/icon-1024.png --out AppIcon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          codesign --force --deep -s - "$APP"
          mkdir dmg && cp -R "$APP" dmg/ && ln -s /Applications dmg/Applications
          hdiutil create -volname "LightPDF Studio" -srcfolder dmg -ov -format UDZO "LightPDF-Studio-$V-macOS-universal.dmg"
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "*.dmg" }

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-apk --locked
      - name: Build signed APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME
          # test key of the repository (same as v2, so the APK updates an installed v2)
          P=crates/lightpdf-studio/android/keystore.properties
          export CARGO_APK_RELEASE_KEYSTORE=$PWD/crates/lightpdf-studio/android/lightpdf-release.jks
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$(grep '^storePassword=' $P | cut -d= -f2-)
          cargo apk build -p lightpdf-studio --release --lib
          V=$(cargo pkgid -p lightpdf-studio | sed 's/.*[#@]//')
          cp target/release/apk/LightPDF-Studio.apk LightPDF-Studio-$V-Android.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "*.apk" }

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-ios" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p lightpdf-studio --bin lightpdf-studio --target aarch64-apple-ios
      - name: Unsigned IPA (sign it with your own Apple ID, e.g. via Xcode / AltStore / Sideloadly)
        run: |
          V=$(cargo pkgid -p lightpdf-studio | sed 's/.*[#@]//')
          APP="Payload/LightPDF Studio.app"
          mkdir -p "$APP"
          cp target/aarch64-apple-ios/release/lightpdf-studio "$APP/"
          sed "s/VERSION/$V/g" packaging/ios/Info.plist > "$APP/Info.plist"
          sips -z 120 120 packaging/icon-1024.png --out "$APP/AppIcon60x60@2x.png" >/dev/null
          sips -z 152 152 packaging/icon-1024.png --out "$APP/AppIcon76x76@2x~ipad.png" >/dev/null
          zip -qr "LightPDF-Studio-$V-iOS-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: "*.ipa" }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, android, ios]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "dist/*" }
